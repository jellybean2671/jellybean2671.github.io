<!DOCTYPE html>
<html>
<head>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
      <canvas id="canvas"></canvas>
      <div style="display:flex;justify-content:center;padding:10px;background:#00000086;border-radius:5px;color:white;">
        <label for="repulsion">Repulsion</label>
        <input type="range" min="0" max="1000" value="250" id="repulsion">
        <br>
        <label for="distance">Distance</label>
        <input type="range" min="1" max="1000" value="200" id="distance">
        <br>
        <label for="strength">Strength</label>
        <input type="range" min="1" max="400" value="200" id="strength">
      </div>
      <div style="display:flex;">  
        <div class="display">
          <h1 id="header"></h1>
          <h id="comment"></h>
        </div>    
        <input type="file" id="fileInput" accept=".json">
      </div>

    </div>
</body>
</html>
<script src="stuff.js"></script>
